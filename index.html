<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Connect Four</title>
<style>
body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; }
canvas { border: 4px solid #00f; image-rendering: pixelated; background: #00f; }
</style>
</head>
<body>
<canvas id="game" width="420" height="360"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const rows = 6, cols = 7;
const cell = 60;
let board = Array(rows).fill().map(() => Array(cols).fill(null));
let turn = 'R';
let winner = null;

function draw() {
  ctx.fillStyle = '#00f';
  ctx.fillRect(0,0,420,360);
  for (let y=0; y<rows; y++) {
    for (let x=0; x<cols; x++) {
      const px = x*cell + 10, py = y*cell + 10;
      ctx.fillStyle = board[y][x] === 'R' ? '#f00' : board[y][x] === 'Y' ? '#ff0' : '#fff';
      ctx.beginPath();
      ctx.arc(px+20, py+20, 18, 0, Math.PI*2);
      ctx.fill();
    }
  }
  if (winner) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,420,360);
    ctx.fillStyle = '#fff';
    ctx.font = '30px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(winner === 'draw' ? 'Draw!' : (winner === 'R' ? 'Red' : 'Yellow') + ' wins!', 210, 180);
  }
}

function drop(col) {
  if (winner) return;
  for (let y = rows-1; y >= 0; y--) {
    if (!board[y][col]) {
      board[y][col] = turn;
      if (checkWin(y, col)) winner = turn;
      else if (board.every(r => r.every(c => c))) winner = 'draw';
      turn = turn === 'R' ? 'Y' : 'R';
      draw();
      return;
    }
  }
}

function checkWin(y, x) {
  const player = board[y][x];
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (let [dy, dx] of dirs) {
    let count = 1;
    for (let d=1; d<4; d++) {
      const ny = y + dy*d, nx = x + dx*d;
      if (ny>=0 && ny<rows && nx>=0 && nx<cols && board[ny][nx] === player) count++;
      else break;
    }
    for (let d=1; d<4; d++) {
      const ny = y - dy*d, nx = x - dx*d;
      if (ny>=0 && ny<rows && nx>=0 && nx<cols && board[ny][nx] === player) count++;
      else break;
    }
    if (count >= 4) return true;
  }
  return false;
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const col = Math.floor((e.clientX - rect.left) / cell);
  if (col >= 0 && col < cols) drop(col);
});

draw();
</script>
</body>
</html>
